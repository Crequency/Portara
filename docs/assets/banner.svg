<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <!-- Portara 顶部横幅：纯矢量、无外链、无位图。
       品牌渐变与门形标记取自 web/src/logo.json（唯一事实来源），与 docs/assets/logo.svg 同色同形。 -->
  <title id="banner-title">Portara — Enterprise-grade AI API Gateway</title>
  <desc id="banner-desc">Dark banner with the Portara gate mark, the PORTARA wordmark and a usage heatmap motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c2cef2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#5b8cff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f6bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#93a4c8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="150" cy="190" r="300" fill="url(#glow-left)"/>
    <circle cx="1180" cy="40" r="280" fill="url(#glow-right)"/>
    <rect width="1280" height="140" fill="url(#sheen)"/>

    <!-- 门形标记：logo.json 的 path，32 视图缩放到 144 -->
    <g transform="translate(56 88) scale(4.5)">
      <path d="M6.5 27V13.2a9.5 9.5 0 0 1 19 0V27H6.5ZM11.3 27V13.7a4.7 4.7 0 0 1 9.4 0V27h-9.4Z" fill="url(#brand)" fill-rule="evenodd"/>
    </g>

    <!-- 字标：textLength 钉宽，避免不同系统的字体度量把标题撑出版面 -->
    <text x="216" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="4" textLength="470" lengthAdjust="spacing" fill="url(#wordmark)">PORTARA</text>
    <rect x="218" y="188" width="88" height="4" rx="2" fill="url(#brand)"/>
