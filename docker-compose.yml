# Portara — 开发与部署统一编排
#
#   开发（只起依赖，应用在宿主机跑 pnpm dev）：
#     docker compose up -d postgres redis
#
#   部署（全栈容器化）：
#     docker compose --profile app up -d --build
#
# 端口分配见决策记录 D-008（内部资料）；宿主机端口刻意避开既有容器占用
# （55432 已被 other-project-pg 占用，故 PG 用 52744）。
#
# 所有宿主端口都可用环境变量覆盖（默认值不变）；这样用独立 project name 起测试栈时
# 不会撞上常驻的 portara-postgres-1 / portara-redis-1：
#   PORTARA_HTTP_PORT（默认 52740）、PORTARA_PG_PORT（默认 52744）、
#   PORTARA_REDIS_PORT（默认 52745）。

name: portara

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portara}
      POSTGRES_DB: portara
    # 只绑回环，避免把数据库暴露到局域网
    ports:
      - "127.0.0.1:${PORTARA_PG_PORT:-52744}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portara -d portara"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PORTARA_REDIS_PORT:-52745}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  portara:
    profiles: ["app"]
    # Caddy 多阶段镜像：Caddy 对外 8080，Node 仅在容器内 127.0.0.1:52740
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: portara-caddy:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORTARA_PORT: "52740"
      PORTARA_HOST: "127.0.0.1"
      PORTARA_SITE_ADDR: ":8080"
      PORTARA_UPSTREAM: "127.0.0.1:52740"
      PORTARA_WEB_ROOT: "/srv/web"
      DATABASE_URL: postgres://portara:${POSTGRES_PASSWORD:-portara}@postgres:5432/portara
      REDIS_URL: redis://redis:6379
      PORTARA_MASTER_KEY: ${PORTARA_MASTER_KEY:?生产部署必须设置 PORTARA_MASTER_KEY}
      PORTARA_SESSION_SECRET: ${PORTARA_SESSION_SECRET:?生产部署必须设置 PORTARA_SESSION_SECRET}
      PORTARA_ADMIN_USERNAME: ${PORTARA_ADMIN_USERNAME:-admin}
      PORTARA_ADMIN_PASSWORD: ${PORTARA_ADMIN_PASSWORD:?必须设置初始管理员密码}
      PORTARA_COOKIE_SECURE: ${PORTARA_COOKIE_SECURE:-false}
    ports:
      - "${PORTARA_HTTP_PORT:-52740}:8080"
    # 健康检查走 Caddy（/healthz 反代到 Node）
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
  redisdata:
